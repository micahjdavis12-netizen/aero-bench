name: Publish small Mac update
on:
  push:
    branches: [main]
    paths: ['*.py', 'desktop/**', 'web/**', 'project.json', 'updates/channel.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-updates
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Validate updater and generate pinned manifest
        run: |
          python3 -m unittest discover -s tests
          python3 release_manifest.py
      - name: Publish channel metadata
        run: |
          git add updates/stable.json
          if git diff --cached --quiet -- updates/stable.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish small Mac code update'
          git push origin HEAD:main
